# ============================================================
# Openinary Railway Template - Deploy Configuration
# https://docs.railway.com/reference/config-as-code
# ============================================================

[build]
# Use Dockerfile as the build source
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# The base image's CMD handles service startup (via supervisord).
# We run startup.sh first to set up environment, then exec the original CMD.
startCommand = "bash /app/startup.sh && exec /usr/local/bin/docker-entrypoint.sh"

# Number of replicas
numReplicas = 1

# Health check — Railway hits this path and expects a 2xx response.
# Using / (root) as healthcheck because Next.js always returns 200 on root.
# This ensures the deploy passes even before auth is configured.
healthcheckPath = "/"
healthcheckTimeout = 300

# Restart policy: restart on failure, up to 3 times
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ============================================================
# Persistent Volume
# Stores the SQLite database: admin accounts, API keys, metadata.
# Without this volume, all data is lost on every redeploy.
# ============================================================
[[volumes]]
  name = "openinary-db"
  mountPath = "/app/data"
