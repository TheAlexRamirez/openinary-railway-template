# ============================================================
# Openinary Railway Template - Deploy Configuration
# https://docs.railway.com/reference/config-as-code
# ============================================================

[build]
# Use Dockerfile as the build source
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Custom startup command that generates missing secrets and waits for services to be ready.
# This runs AFTER Railway has injected environment variables from railway.json.
startCommand = "bash /app/startup.sh"

# Number of replicas
numReplicas = 1

# Health check — Railway hits this path and expects a 2xx response.
# Using /api/health endpoint which doesn't require authentication.
# This endpoint is specifically designed for health checks.
healthcheckPath = "/api/health"
healthcheckTimeout = 300

# Restart policy: restart on failure, up to 3 times
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ============================================================
# Persistent Volume
# Stores the SQLite database: admin accounts, API keys, metadata.
# Without this volume, all data is lost on every redeploy.
# ============================================================
[[volumes]]
  name = "openinary-db"
  mountPath = "/app/data"
